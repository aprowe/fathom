<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gravity — fathom</title>
    <style>
      /*
       * The only HTML in the app: a page whose whole job is to hand egui a canvas.
       * Everything above this line — panel, controls, layout — is Rust.
       */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0e1116;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 40px;
        max-width: 46ch;
        margin: 0 auto;
        color: #7c8899;
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
      }

      #fallback h1 {
        margin: 0;
        color: #dce3ed;
        font-size: 19px;
      }

      #fallback code {
        color: #dce3ed;
      }
    </style>
  </head>
  <body>
    <canvas id="sim" oncontextmenu="return false"></canvas>
    <div id="fallback" hidden></div>

    <script type="module">
      import init, { start } from '../pkg/gravity.js'

      const fail = (message) => {
        const box = document.getElementById('fallback')
        box.hidden = false
        box.innerHTML =
          '<h1>This browser can&rsquo;t reach a GPU</h1>' +
          '<p>' + message + '</p>' +
          '<p>The simulation draws through WebGPU. Chrome and Edge 113 or newer support ' +
          'it, as does Safari 26. In Firefox, enable <code>dom.webgpu.enabled</code> and ' +
          'restart.</p>'
        document.getElementById('sim').hidden = true
      }

      // The right button aims a body; the browser must not answer it with a menu.
      document.addEventListener('contextmenu', (e) => e.preventDefault())

      try {
        await init()
        await start(document.getElementById('sim'))
      } catch (error) {
        console.error('[boot] failed', error)
        fail(String(error && error.message ? error.message : error))
      }
    </script>
  </body>
</html>

[package]
name = "fathom-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An egui shell for fathom apps: one native window, no web technology."

[dependencies]
fathom-core = { workspace = true }
fathom-components = { workspace = true }
egui-wgpu = "0.36"
serde_json = "1"
log = "0.4"
web-time = "1"
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "default_fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = "0.16"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Window", "Element",
] }

[dev-dependencies]
pollster = "0.4"
